name: Deploy Frontend

on:
  push:
    branches: [dev, stg, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'stg' && 'stg' || 'dev' }}

    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'stg' && 'stg' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          # Stripe publishable keys are public (they ship in the site's JavaScript).
          # Production must use the live key to match the prod API's live secret key.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ github.ref_name == 'main' && 'pk_live_51T2zFLBKRCpVjvyrO2NgLHS1OqrpQpSswDAK3hKIAortjxpk7mhpDSHnAV9NcoAlDQGWyUOmW6eLpFjSlGPsMPvF00QXeAdMV8' || 'pk_test_51T2zFZBGag0rnP6cKdXxNyisEJadY8SsyXxmippSLIfGhFmXJgenz7VQcc3dWO1FymZqJ47AgtOu8HOAeKqsdhwo00bdjtWzRo' }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # dev and stg must never appear in search results (app repo BACKLOG M.6)
      - name: Keep test sites out of search
        if: env.ENVIRONMENT != 'prod'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > build/robots.txt
          rm -f build/sitemap.xml

      - name: Sync to S3 (${{ env.ENVIRONMENT }})
        run: |
          BUCKET="billtup-frontend-${{ env.ENVIRONMENT }}"
          aws s3 sync build/ "s3://$BUCKET" \
            --delete \
            --cache-control "max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml"
          aws s3 cp build/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"
          # Read by search engines: a short cache so changes reach them quickly
          aws s3 cp build/robots.txt "s3://$BUCKET/robots.txt" --cache-control "max-age=3600"
          if [ -f build/sitemap.xml ]; then
            aws s3 cp build/sitemap.xml "s3://$BUCKET/sitemap.xml" --cache-control "max-age=3600"
          else
            aws s3 rm "s3://$BUCKET/sitemap.xml" || true
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-type: application/json' \
              -d '{"text":"[Frontend] Deploy (${{ env.ENVIRONMENT }}) failed for ${{ github.sha }}"}'
          fi
